[package]
name = "speedal-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop UI for NVIDIA speaker diarization and streaming ASR"

[lib]
name = "speedal_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
speedal-audio.workspace = true
speedal-diar.workspace = true
speedal-session.workspace = true
speedal-spk.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
