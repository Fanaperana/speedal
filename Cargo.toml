[package]
name = "speedal"
version = "0.1.0"
edition = "2024"
description = "Speaker diarization with NVIDIA Nemotron-3 Diarization"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.4.3"
hound = "3.5"
parakeet-rs = { version = "0.4", features = ["sortformer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
