[workspace]
resolver = "2"
members = [
    "crates/speedal-audio",
    "crates/speedal-diar",
    "crates/speedal-asr",
    "crates/speedal-spk",
    "crates/speedal-session",
    "crates/speedal-cli",
]
default-members = ["crates/speedal-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
flexaudio = "0.8"
hf-hub = "0.4.3"
hound = "3.5"
ndarray = "0.17"
parakeet-rs = { version = "0.4", features = ["sortformer"] }
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speedal-audio = { path = "crates/speedal-audio" }
speedal-asr = { path = "crates/speedal-asr" }
speedal-diar = { path = "crates/speedal-diar" }
speedal-session = { path = "crates/speedal-session" }
speedal-spk = { path = "crates/speedal-spk" }
